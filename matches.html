<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Manage Matches | Tournament Portal</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0" />

  <link rel="stylesheet" href="index.css">
  <link rel="stylesheet" href="matches.css">
</head>
<body class="no-scroll-body">

  <div id="sidebarBackdrop" class="sidebar-backdrop"></div>

  <header class="top-header">
    <div class="header-left">
      <button id="hamburgerBtn" class="icon-btn hamburger-btn" aria-label="Toggle Menu">
        <span class="material-symbols-outlined">menu</span>
      </button>
      <div class="brand">
        <span class="material-symbols-outlined logo-icon">emoji_events</span>
        <span class="brand-title">Tournament Portal</span>
      </div>
      <h1 class="page-title">Manage Matches</h1>
    </div>
    <div class="header-right">
      <button id="themeToggleBtn" class="icon-btn" aria-label="Toggle Theme"></button>
    </div>
  </header>

  <div class="app-container page-fixed-layout">
    <aside id="sidebar" class="sidebar">
      <nav id="sidebarNavContainer" class="sidebar-nav"></nav>
      <div class="sidebar-footer">
        <div class="user-profile">
          <span class="material-symbols-outlined user-avatar">account_circle</span>
          <div class="user-info">
            <span class="user-name">Administrator</span>
            <span class="user-role">Administrator</span>
          </div>
        </div>
        <button id="logoutBtn" class="icon-btn logout-btn" title="Logout">
          <span class="material-symbols-outlined">logout</span>
        </button>
      </div>
    </aside>

    <main class="content-body fixed-content">
      <section class="matches-action-bar">
        <div class="filter-group">
          <div class="filter-item">
            <label for="matchesEventSelect">Event</label>
            <div class="select-wrapper">
              <select id="matchesEventSelect" class="styled-select" onchange="loadMatchesForEvent()">
                <option value="">-- Select Event --</option>
              </select>
            </div>
          </div>

          <div class="filter-item">
            <label for="roundFilterSelect">Round Filter</label>
            <div class="select-wrapper">
              <select id="roundFilterSelect" class="styled-select" onchange="applyMatchFilters()">
                <option value="ALL">All Rounds</option>
              </select>
            </div>
          </div>

          <div class="filter-item">
            <label for="statusFilterSelect">Status</label>
            <div class="select-wrapper">
              <select id="statusFilterSelect" class="styled-select" onchange="applyMatchFilters()">
                <option value="ALL">All Statuses</option>
                <option value="PENDING">Pending</option>
                <option value="COMPLETED">Completed</option>
                <option value="BYE">Bye</option>
              </select>
            </div>
          </div>
        </div>

        <div class="bar-right">
          <button class="btn btn-secondary" onclick="backToBrackets()">
            <span class="material-symbols-outlined">account_tree</span>
            <span>View Bracket</span>
          </button>
        </div>
      </section>

      <!-- Matches Table -->
      <div class="table-card-wrapper">
        <table class="matches-table">
          <thead>
            <tr>
              <th>Match ID</th>
              <th>Round</th>
              <th>Participant 1</th>
              <th>Participant 2</th>
              <th>Score</th>
              <th>Venue</th>
              <th>Adjudicator</th>
              <th>Status</th>
              <th>Actions</th>
            </tr>
          </thead>
          <tbody id="matchesTableBody">
            <tr>
              <td colspan="9" class="table-placeholder">Select an event to view match records.</td>
            </tr>
          </tbody>
        </table>
      </div>
    </main>
  </div>

  <!-- 1. Edit Details Modal -->
  <div id="matchDetailsModal" class="modal-backdrop hidden">
    <div class="modal-card">
      <div class="modal-header">
        <h3>Match Logistics & Details</h3>
        <button class="icon-btn" onclick="closeMatchDetailsModal()">
          <span class="material-symbols-outlined">close</span>
        </button>
      </div>

      <form id="matchDetailsForm" onsubmit="handleMatchDetailsSubmit(event)">
        <input type="hidden" id="detailsMatchId">

        <div class="modal-form-grid">
          <div class="form-group">
            <label for="modalVenue">Venue / Room</label>
            <input type="text" id="modalVenue" class="form-input" placeholder="e.g. Room 302 or Court A">
          </div>

          <div class="form-group">
            <label for="modalAdjudicator">Adjudicator / Referee</label>
            <input type="text" id="modalAdjudicator" class="form-input" placeholder="e.g. John Doe">
          </div>

          <div class="form-group">
            <label for="modalScheduledTime">Scheduled Time</label>
            <input type="datetime-local" id="modalScheduledTime" class="form-input">
          </div>

          <div class="form-group">
            <label for="modalStationNo">Table / Station No.</label>
            <input type="text" id="modalStationNo" class="form-input" placeholder="e.g. Table 4">
          </div>

          <div class="form-group full-width">
            <label for="modalRemarks">Remarks / Notes</label>
            <textarea id="modalRemarks" class="form-input textarea-input" rows="3" placeholder="Enter any extra match notes..."></textarea>
          </div>
        </div>

        <div id="detailsModalFeedback" class="feedback-msg"></div>

        <div class="modal-footer">
          <button type="button" class="btn btn-secondary" onclick="closeMatchDetailsModal()">Cancel</button>
          <button type="submit" class="btn btn-primary">Save Details</button>
        </div>
      </form>
    </div>
  </div>

  <!-- 2. Score Modal -->
  <div id="matchScoreModal" class="modal-backdrop hidden">
    <div class="modal-card">
      <div class="modal-header">
        <h3>Submit Match Score</h3>
        <button class="icon-btn" onclick="closeMatchScoreModal()">
          <span class="material-symbols-outlined">close</span>
        </button>
      </div>

      <form id="matchScoreForm" onsubmit="handleMatchScoreSubmit(event)">
        <input type="hidden" id="modalScoreMatchId">

        <div class="score-input-row">
          <div class="team-score-box">
            <label id="modalP1Name">Participant 1</label>
            <input type="number" id="modalScore1" class="form-input score-field" min="0" required value="0">
          </div>
          <div class="vs-divider">VS</div>
          <div class="team-score-box">
            <label id="modalP2Name">Participant 2</label>
            <input type="number" id="modalScore2" class="form-input score-field" min="0" required value="0">
          </div>
        </div>

        <div id="matchModalFeedback" class="feedback-msg"></div>

        <div class="modal-footer">
          <button type="button" class="btn btn-secondary" onclick="closeMatchScoreModal()">Cancel</button>
          <button type="submit" class="btn btn-primary">Save Result & Advance</button>
        </div>
      </form>
    </div>
  </div>

  <script src="util.js"></script>
  <script src="matches.js"></script>
</body>
</html>
