<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Staff Management | Tournament Portal</title>
  
  <!-- Fonts & Material Symbols -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0" />
  
  <!-- Shared App Stylesheets -->
  <link rel="stylesheet" href="index.css">
  <link rel="stylesheet" href="staff.css">
</head>
<body>

  <!-- Mobile Sidebar Backdrop -->
  <div id="sidebarBackdrop" class="sidebar-backdrop"></div>

  <!-- 1. Full-Width Top Header -->
  <header class="top-header">
    <div class="header-left">
      <button id="hamburgerBtn" class="icon-btn hamburger-btn" aria-label="Toggle Menu">
        <span class="material-symbols-outlined">menu</span>
      </button>
      <div class="brand">
        <span class="material-symbols-outlined logo-icon" data-config="brand-icon">emoji_events</span>
        <span class="brand-title" data-config="brand-name">Tournament Portal</span>
      </div>
      <h1 class="page-title">Staff Management</h1>
    </div>

    <div class="header-right">
      <button id="themeToggleBtn" class="icon-btn" aria-label="Toggle Theme"></button>
    </div>
  </header>

  <!-- 2. Main Workspace Layout -->
  <div class="app-container">

    <!-- Left Sidebar Navigation -->
    <aside id="sidebar" class="sidebar">
      <nav id="sidebarNavContainer" class="sidebar-nav">
        <!-- Injected dynamically via util.js -->
      </nav>

      <div class="sidebar-footer">
        <div class="user-profile">
          <span class="material-symbols-outlined user-avatar">account_circle</span>
          <div class="user-info">
            <span id="navUserName" class="user-name">Admin User</span>
            <span id="navUserRole" class="user-role">Administrator</span>
          </div>
        </div>
        <button id="logoutBtn" class="icon-btn logout-btn" title="Logout">
          <span class="material-symbols-outlined">logout</span>
        </button>
      </div>
    </aside>

    <!-- Right Main Content Body -->
    <main class="content-body">
      <!-- Content Loading Overlay -->
      <div id="contentLoadingOverlay" class="content-loading-overlay">
        <div class="loading-spinner"></div>
      </div>

      <!-- Action & Filter Bar -->
      <section class="action-bar">
        <div class="filter-group">
          <!-- Search Bar -->
          <div class="filter-item">
            <label for="staffSearchInput">Search</label>
            <div class="search-wrapper">
              <span class="material-symbols-outlined">search</span>
              <input type="text" id="staffSearchInput" class="styled-input search-input" placeholder="Search by name, school ID..." oninput="applyFilters()">
            </div>
          </div>

          <!-- Role Filter -->
          <div class="filter-item">
            <label for="roleFilterSelect">Role</label>
            <div class="select-wrapper">
              <select id="roleFilterSelect" class="styled-select" onchange="applyFilters()">
                <option value="ALL">All Roles</option>
                <option value="ADMIN">Admin</option>
                <option value="ADJUDICATOR">Adjudicator</option>
              </select>
            </div>
          </div>
        </div>

        <button type="button" id="addStaffBtn" class="btn btn-primary" onclick="openStaffModal()">
          <span class="material-symbols-outlined">person_add</span>
          <span>Add New Staff</span>
        </button>
      </section>

      <!-- Staff Roster Table -->
      <section class="table-card-wrapper">
        <table class="staff-table">
          <thead>
            <tr>
              <th>Staff Member</th>
              <th>Role</th>
              <th>Phone Number</th>
              <th>School ID / Class</th>
              <th>Assignment</th>
              <th style="text-align: right;">Actions</th>
            </tr>
          </thead>
          <tbody id="staffTableBody">
            <tr>
              <td colspan="6" class="table-placeholder">Loading staff roster...</td>
            </tr>
          </tbody>
        </table>
      </section>
    </main>
  </div>

  <!-- Add / Edit Staff Modal Overlay -->
  <div id="staffModal" class="modal-backdrop hidden">
    <div class="modal-card">
      <div class="modal-header">
        <h3 id="staffModalTitle">Add Staff Member</h3>
        <button type="button" id="closeStaffModalBtn" class="icon-btn" onclick="closeStaffModal()">
          <span class="material-symbols-outlined">close</span>
        </button>
      </div>

      <!-- Removed onsubmit attribute to prevent double form submission triggers -->
      <form id="staffForm">
        <input type="hidden" id="modalStaffId">

        <div class="modal-form-grid">
          <div class="form-group full-width">
            <label for="modalFullName">Full Name *</label>
            <input type="text" id="modalFullName" class="form-input" required placeholder="e.g. John Doe">
          </div>

          <div class="form-group">
            <label for="modalPhone">Phone Number *</label>
            <input type="tel" id="modalPhone" class="form-input" required placeholder="012-345 6789">
          </div>

          <div class="form-group">
            <label for="modalSchoolId">School ID *</label>
            <input type="text" id="modalSchoolId" class="form-input" required placeholder="e.g. SCH-9021">
          </div>

          <div class="form-group">
            <label for="modalClass">Class / Grade</label>
            <input type="text" id="modalClass" class="form-input" placeholder="e.g. 5 Alpha / Grade 11">
          </div>

          <div class="form-group">
            <label for="modalRole">System Role *</label>
            <select id="modalRole" class="form-input" required>
              <option value="ADJUDICATOR">Adjudicator</option>
              <option value="ADMIN">Admin</option>
            </select>
          </div>

          <div class="form-group full-width">
            <label for="modalAssignment">Assigned Venue / Duty</label>
            <input type="text" id="modalAssignment" class="form-input" placeholder="e.g. Court A / Main Hall">
          </div>

          <div class="form-group full-width">
            <label for="modalNotes">Remarks / Notes</label>
            <textarea id="modalNotes" class="form-input textarea-input" placeholder="Additional details or certifications..."></textarea>
          </div>
        </div>

        <div id="staffModalFeedback" class="feedback-msg"></div>

        <div class="modal-footer">
          <button type="button" id="cancelStaffModalBtn" class="btn btn-secondary" onclick="closeStaffModal()">Cancel</button>
          <button type="submit" class="btn btn-primary">Save Staff Member</button>
        </div>
      </form>
    </div>
  </div>

  <!-- Scripts -->
  <script src="util.js"></script>
  <script src="staff.js"></script>
</body>
</html>
