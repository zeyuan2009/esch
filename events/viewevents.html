<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>View Events | Tournament Portal</title>
  
  <!-- Fonts & Material Symbols -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0" />
  
  <!-- Page Stylesheets -->
  <link rel="stylesheet" href="../index.css">
  <link rel="stylesheet" href="viewevents.css">
</head>
<body>

  <!-- Mobile Sidebar Backdrop -->
  <div id="sidebarBackdrop" class="sidebar-backdrop"></div>

  <!-- Full-Width Top Header -->
  <header class="top-header">
    <div class="header-left">
      <button id="hamburgerBtn" class="icon-btn hamburger-btn" aria-label="Toggle Menu">
        <span class="material-symbols-outlined">menu</span>
      </button>
      <div class="brand">
        <span class="material-symbols-outlined logo-icon" data-config="brand-icon">emoji_events</span>
        <span class="brand-title" data-config="brand-name">Tournament Portal</span>
      </div>
      <h1 class="page-title">Events Directory</h1>
    </div>

    <div class="header-right">
      <button id="themeToggleBtn" class="icon-btn" aria-label="Toggle Theme"></button>
    </div>
  </header>

  <!-- Main Workspace Layout -->
  <div class="app-container">

    <!-- Left Sidebar Navigation -->
    <aside id="sidebar" class="sidebar">
      <nav id="sidebarNavContainer" class="sidebar-nav">
        <!-- Injected dynamically via util.js -->
      </nav>

      <div class="sidebar-footer">
        <div class="user-profile">
          <span class="material-symbols-outlined user-avatar">account_circle</span>
          <div class="user-info">
            <span class="user-name">John Doe</span>
            <span class="user-role">Administrator</span>
          </div>
        </div>
        <button id="logoutBtn" class="icon-btn logout-btn" title="Logout">
          <span class="material-symbols-outlined">logout</span>
        </button>
      </div>
    </aside>

    <!-- Right Main Content Body -->
    <main class="content-body">
      <!-- Content-Scoped Loading Overlay -->
      <div id="contentLoadingOverlay" class="content-loading-overlay">
        <div class="loading-spinner"></div>
      </div>

      <!-- Header Action Controls -->
      <section class="events-action-bar">
        <div class="search-box">
          <span class="material-symbols-outlined search-icon">search</span>
          <input type="text" id="eventSearchInput" placeholder="Search events..." oninput="filterEvents()">
        </div>
        <button class="btn btn-primary" onclick="openCreateModal()">
          <span class="material-symbols-outlined">add</span>
          <span>Create Event</span>
        </button>
      </section>

      <!-- Events Directory Card -->
      <section class="dashboard-card">
        <div id="eventsTableContainer">
          <p class="placeholder-text">Loading events list...</p>
        </div>
      </section>
    </main>
  </div>

  <!-- Create / Edit Event Modal -->
  <div id="eventModal" class="modal-backdrop hidden">
    <div class="modal-card">
      <div class="modal-header">
        <h3 id="modalTitle">Create Event</h3>
        <button class="icon-btn" onclick="closeModal()">
          <span class="material-symbols-outlined">close</span>
        </button>
      </div>
      <form id="eventForm" onsubmit="handleFormSubmit(event)">
        <input type="hidden" id="modalEventId">
        
        <div class="form-group">
          <label for="modalEventName">Event Name *</label>
          <input type="text" id="modalEventName" class="form-input" required placeholder="e.g. Summer Esports Championship">
        </div>

        <div class="form-row">
          <div class="form-group">
            <label for="modalEventType">Type *</label>
            <input type="text" id="modalEventType" class="form-input" required placeholder="e.g. FC24 / VALORANT">
          </div>
          <div class="form-group">
            <label for="modalEventFormat">Format</label>
            <select id="modalEventFormat" class="form-input">
              <option value="1v1">1v1</option>
              <option value="5v5">5v5</option>
              <option value="2v2">2v2</option>
              <option value="Battle Royale">Battle Royale</option>
            </select>
          </div>
        </div>

        <div class="form-row">
          <div class="form-group">
            <label for="modalMaxEntrants">Max Entrants</label>
            <input type="number" id="modalMaxEntrants" class="form-input" min="0" value="32">
          </div>
          <div class="form-group">
            <label for="modalFee">Registration Fee ($)</label>
            <input type="number" id="modalFee" class="form-input" min="0" step="0.01" value="0.00">
          </div>
        </div>

        <div class="form-group">
          <label for="modalRemarks">Remarks</label>
          <textarea id="modalRemarks" class="form-input" rows="3" placeholder="Additional details or rules..."></textarea>
        </div>

        <div id="modalFeedback" class="feedback-msg"></div>

        <div class="modal-footer">
          <button type="button" class="btn btn-secondary" onclick="closeModal()">Cancel</button>
          <button type="submit" id="saveEventBtn" class="btn btn-primary">Save Event</button>
        </div>
      </form>
    </div>
  </div>

  <!-- Scripts -->
  <script src="util.js"></script>
  <script src="viewevents.js"></script>
</body>
</html>
