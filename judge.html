<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Adjudicator Portal | Tournament Management</title>
  
  <!-- Fonts & Material Symbols -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0" />
  
  <!-- Stylesheets -->
  <link rel="stylesheet" href="index.css">
  <link rel="stylesheet" href="judge.css">
</head>
<body class="judge-page">

  <!-- Adjudicator Portal Container -->
  <main class="judge-container">
    
    <!-- Header Controls -->
    <header class="judge-header">
      <div class="judge-info">
        <h1 data-config="brand-name">Tournament Portal</h1>
        <span class="judge-badge">Adjudicator: <span class="user-name">Loading...</span></span>
      </div>
      <div class="header-actions">
        <button id="themeToggleBtn" class="icon-btn" aria-label="Toggle Theme"></button>
        <button id="logoutBtn" class="icon-btn" title="Sign Out">
          <span class="material-symbols-outlined">logout</span>
        </button>
      </div>
    </header>

    <!-- Main Content Section -->
    <section>
      <div class="section-title-bar">
        <h2>Assigned Matches</h2>
        <button id="refreshMatchesBtn" class="btn btn-secondary btn-sm">
          <span class="material-symbols-outlined">refresh</span> Refresh
        </button>
      </div>

      <!-- Assigned Matches Render List -->
      <div id="assignedMatchesList">
        <div class="empty-state">
          <span class="material-symbols-outlined spin">sync</span>
          <p>Fetching assigned matches...</p>
        </div>
      </div>
    </section>

  </main>

  <!-- Core Utility Scripts -->
  <script src="util.js"></script>
  <script src="judge.js"></script>
</body>
</html>
